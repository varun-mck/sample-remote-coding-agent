[project]
name = "coding-agent"
version = "0.3.0"
description = "AgentCore runtime: Kiro CLI harness with AgentCore Gateway MCP"
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.2.0,<2",
    "bedrock-agentcore>=1.0,<2",
    "boto3>=1.43.95,<2",
    "botocore>=1.43.95,<2",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[mypy]
python_version = 3.11
mypy_path = agent/src:api/src:infra:scripts
namespace_packages = True
explicit_package_bases = True
exclude = (?x)(^|/)cdk\.out/
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
sqlite_cache = False

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True